<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تحكم البيت">
<link rel="apple-touch-icon" href="icon-180.png">
<title>تحكم الشاشات</title>
<style>
@font-face { font-family: T; src: url(fonts/thmanyah-400.otf); font-weight: 400; }
@font-face { font-family: T; src: url(fonts/thmanyah-700.otf); font-weight: 700; }
:root { --ink: #f4f7fb; --soft: rgba(244,247,251,.68); --faint: rgba(244,247,251,.42); --teal: #4cc3c9; --red: #ff8a8a;
  --line: rgba(255,255,255,.12); --card: rgba(255,255,255,.06); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #081a33; }
body { min-height: 100vh; color: var(--ink); font-family: T, -apple-system, sans-serif;
  background: linear-gradient(170deg, #0d2c52 0%, #081a33 45%, #050d1a 100%) fixed;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
h1 { font-size: 24px; margin-bottom: 4px; }
.sub { color: var(--soft); font-size: 14px; margin-bottom: 18px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h2 { font-size: 21px; }
.st { font-size: 12px; color: var(--soft); display: flex; align-items: center; gap: 6px; }
.st i { width: 8px; height: 8px; border-radius: 4px; background: #e3b866; }
.st.ok i { background: #6ee7a8; } .st.bad i { background: var(--red); }
.now { font-size: 14px; color: var(--soft); margin: 6px 0 12px; min-height: 20px; }
.now b { color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-top: 1px solid var(--line); }
.row .l b { display: block; font-size: 17px; }
.row .l span { font-size: 12px; color: var(--soft); }
.sw { position: relative; width: 58px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.18); border: 0; flex: none; transition: background .2s; }
.sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; border-radius: 14px; background: #fff; transition: transform .2s; }
.sw.on { background: var(--red); }
.sw.on::after { transform: translateX(-24px); }
.dur { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.dur button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; }
.dur button.sel { background: var(--teal); color: #04202a; border-color: var(--teal); font-weight: 700; }
.lbl { font-size: 13px; color: var(--soft); margin-top: 8px; }
details { border-top: 1px solid var(--line); margin-top: 2px; }
summary { padding: 12px 2px; font-size: 15px; color: var(--soft); cursor: pointer; list-style: none; }
summary::after { content: ' ▾'; }
.pending { font-size: 12px; color: #e3b866; min-height: 16px; }
.until { font-size: 13px; color: var(--red); margin-bottom: 6px; }
.empty { color: var(--soft); text-align: center; padding: 60px 10px; line-height: 1.9; }
.note { font-size: 12px; color: var(--faint); line-height: 1.7; margin-top: 10px; }
</style>
</head>
<body>
<h1>تحكم الشاشات</h1>
<p class="sub">اقفل التطبيقات واقطع النت عن البوكسات من أي مكان</p>
<div id="boxes"></div>
<p class="note">التحكم يوصل للبوكس خلال ثواني إذا كان شغّال ومتصل بالنت. الميزان والرئيسية والإعدادات ما تنقفل أبداً.</p>

<script>
'use strict';
var NTFY = 'https://ntfy.sh/';
function $(id) { return document.getElementById(id); }
function ar(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// البوكسات تجي من الرابط (#b=topic1,topic2) وتنحفظ في الجوال
var topics = JSON.parse(localStorage.getItem('tvh-topics') || '[]');
var m = location.hash.match(/b=([\w,-]+)/);
if (m) m[1].split(',').forEach(function (t) { if (t && topics.indexOf(t) < 0) topics.push(t); });
localStorage.setItem('tvh-topics', JSON.stringify(topics));
if (m) history.replaceState(null, '', location.pathname);

var boxes = {};   // topic → { st, dur, pending, el }
if (!topics.length) $('boxes').innerHTML = '<div class="empty">ما فيه بوكسات مربوطة.<br>افتح رابط الربط اللي وصلك مرة وحدة، وبعدها تفتح الصفحة على طول.</div>';
topics.forEach(function (t) {
  var b = boxes[t] = { topic: t, st: null, dur: 0, pending: '' };
  b.el = document.createElement('div');
  b.el.className = 'box';
  $('boxes').appendChild(b.el);
  draw(b);
  listen(b);
});

function listen(b) {
  var es = new EventSource(NTFY + b.topic + '-s/sse?since=12h');
  es.onmessage = function (e) {
    try { var o = JSON.parse(e.data); b.st = JSON.parse(o.message); } catch (x) { return; }
    b.pending = '';
    draw(b);
  };
  // لو ما وصلت حالة من فترة نطلبها
  setTimeout(function () { if (!b.st || Date.now() - b.st.ts > 15 * 60000) send(b, { ping: 1 }); }, 2500);
}
setInterval(function () { Object.keys(boxes).forEach(function (t) { draw(boxes[t]); }); }, 30000);

function send(b, msg) {
  return fetch(NTFY + b.topic, { method: 'POST', body: JSON.stringify(msg) }).catch(function () {
    b.pending = 'ما قدرت أرسل، تأكد من النت'; draw(b);
  });
}

function untilFor(d) {
  if (!d) return 0;
  if (d === 'am') { var x = new Date(); x.setHours(6, 0, 0, 0); if (x <= new Date()) x.setDate(x.getDate() + 1); return x.getTime(); }
  return Date.now() + d * 60000;
}

function apply(b, change) {
  var s = b.st || { net: true, lock: [] };
  var want = { net: s.net, lock: (s.lock || []).slice(), until: s.until || 0 };
  change(want);
  var locking = !want.net || want.lock.length, was = !s.net || (s.lock || []).length;
  // لو كان مقفل من قبل وما غيّرت المدة، نخلي نفس وقت الفك
  want.until = !locking ? 0 : (was && !b.durTouched) ? (s.until || 0) : untilFor(b.dur);
  b.durTouched = false;
  b.pending = 'يرسل…';
  b.st = Object.assign({}, s, want);   // نعرضها على طول، والبوكس يأكدها
  draw(b);
  send(b, want).then(function () { if (b.pending === 'يرسل…') { b.pending = 'وصل الأمر، بانتظار البوكس…'; draw(b); } });
}

function time12(ms) {
  var d = new Date(ms), h = d.getHours(), mm = d.getMinutes();
  var t = ar((h % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm) + (h < 12 ? ' ص' : ' م');
  var today = new Date().toDateString() === d.toDateString();
  return (today ? '' : 'بكرة ') + t;
}

function draw(b) {
  var s = b.st, el = b.el;
  if (!s) { el.innerHTML = '<div class="top"><h2>بوكس</h2><div class="st"><i></i>ينتظر البوكس…</div></div><p class="now">لو طال الانتظار، البوكس طافي أو بدون نت.</p>'; return; }
  var age = Date.now() - s.ts, online = age < 16 * 60000;
  var lock = s.lock || [];
  var yt = (s.apps || []).filter(function (a) { return /youtube/i.test(a.pkg); })[0];
  var html = '<div class="top"><h2>' + esc(s.name || 'بوكس') + '</h2><div class="st ' + (online ? 'ok' : 'bad') + '"><i></i>' +
    (online ? 'متصل' : 'ما رد من ' + ago(age)) + '</div></div>';
  html += '<p class="now">' + (s.app ? 'آخر تطبيق انفتح: <b>' + esc(s.app) + '</b>' : '') + '</p>';
  if (s.until && (!s.net || lock.length)) html += '<div class="until">القفل ينفك ' + time12(s.until) + '</div>';
  html += row('net', 'قطع الإنترنت', s.net ? 'النت شغّال' : 'مقطوع عن كل التطبيقات', !s.net, 'sw');
  if (yt) html += row('app:' + yt.pkg, 'اليوتيوب', lock.indexOf(yt.pkg) >= 0 ? 'مقفل' : 'مفتوح', lock.indexOf(yt.pkg) >= 0, 'sw');
  html += row('all', 'كل التطبيقات', lock.indexOf('*') >= 0 ? 'مقفلة (إلا الميزان)' : 'مفتوحة', lock.indexOf('*') >= 0, 'sw');
  html += '<div class="lbl">مدة القفل</div><div class="dur">' + [[0, 'لين أفتحه'], [60, 'ساعة'], [120, 'ساعتين'], ['am', 'لين الصبح']].map(function (d) {
    return '<button data-d="' + d[0] + '" class="' + (String(b.dur) === String(d[0]) ? 'sel' : '') + '">' + d[1] + '</button>';
  }).join('') + '</div>';
  var others = (s.apps || []).filter(function (a) { return a !== yt; });
  if (others.length) {
    html += '<details' + (b.open ? ' open' : '') + '><summary>تطبيقات ثانية</summary>' + others.map(function (a) {
      var on = lock.indexOf(a.pkg) >= 0;
      return row('app:' + a.pkg, esc(a.label), on ? 'مقفل' : 'مفتوح', on, 'sw');
    }).join('') + '</details>';
  }
  html += '<div class="pending">' + esc(b.pending) + '</div>';
  el.innerHTML = html;

  el.querySelectorAll('[data-k]').forEach(function (btn) {
    btn.onclick = function () {
      var k = btn.dataset.k;
      apply(b, function (w) {
        if (k === 'net') w.net = !w.net;
        else {
          var p = k === 'all' ? '*' : k.slice(4), i = w.lock.indexOf(p);
          if (i >= 0) w.lock.splice(i, 1); else w.lock.push(p);
        }
      });
    };
  });
  el.querySelectorAll('.dur button').forEach(function (btn) {
    btn.onclick = function () { b.dur = btn.dataset.d === 'am' ? 'am' : +btn.dataset.d; b.durTouched = true; draw(b); };
  });
  var det = el.querySelector('details');
  if (det) det.ontoggle = function () { b.open = det.open; };
}

function row(k, title, sub, on, cls) {
  return '<div class="row"><div class="l"><b>' + title + '</b><span>' + sub + '</span></div><button class="' + cls + (on ? ' on' : '') + '" data-k="' + k + '"></button></div>';
}
function ago(ms) {
  var m = Math.round(ms / 60000);
  if (m < 60) return ar(m) + ' د';
  var h = Math.round(m / 60);
  return h < 48 ? ar(h) + ' ساعة' : ar(Math.round(h / 24)) + ' يوم';
}
</script>
</body>
</html>
