<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="قفل البيت">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>قفل البيت</title>
<style>
@font-face { font-family: T; src: url(fonts/thmanyah-400.otf); font-weight: 400; }
@font-face { font-family: T; src: url(fonts/thmanyah-700.otf); font-weight: 700; }
:root { --ink: #f4f7fb; --soft: rgba(244,247,251,.68); --faint: rgba(244,247,251,.42); --teal: #4cc3c9; --red: #ff8a8a;
  --line: rgba(255,255,255,.12); --card: rgba(255,255,255,.06); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #081a33; }
body { min-height: 100vh; color: var(--ink); font-family: T, -apple-system, sans-serif;
  background: linear-gradient(170deg, #0d2c52 0%, #081a33 45%, #050d1a 100%) fixed;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
h1 { font-size: 24px; margin-bottom: 4px; }
.sub { color: var(--soft); font-size: 14px; margin-bottom: 18px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h2 { font-size: 21px; }
.st { font-size: 12px; color: var(--soft); display: flex; align-items: center; gap: 6px; }
.st i { width: 8px; height: 8px; border-radius: 4px; background: #e3b866; }
.st.ok i { background: #6ee7a8; } .st.bad i { background: var(--red); }
.now { font-size: 14px; color: var(--soft); margin: 6px 0 12px; min-height: 20px; }
.now b { color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-top: 1px solid var(--line); }
.row .l b { display: block; font-size: 17px; }
.row .l span { font-size: 12px; color: var(--soft); }
.sw { position: relative; width: 58px; height: 34px; border-radius: 17px; background: rgba(255,255,255,.18); border: 0; flex: none; transition: background .2s; }
.sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; border-radius: 14px; background: #fff; transition: transform .2s; }
.sw.on { background: var(--red); }
.sw.on::after { transform: translateX(-24px); }
.dur { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.dur button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; }
.dur button.sel { background: var(--teal); color: #04202a; border-color: var(--teal); font-weight: 700; }
.lbl { font-size: 13px; color: var(--soft); margin-top: 8px; }
details { border-top: 1px solid var(--line); margin-top: 2px; }
summary { padding: 12px 2px; font-size: 15px; color: var(--soft); cursor: pointer; list-style: none; }
summary::after { content: ' ▾'; }
.pending { font-size: 12px; color: #e3b866; min-height: 16px; }
.until { font-size: 13px; color: var(--red); margin-bottom: 6px; }
.big { width: 100%; font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 16px; padding: 18px; margin-top: 4px; }
.big.lock { background: #ff6b6b; color: #2a0505; }
.big.open { background: #6ee7a8; color: #04261a; }
.state { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px; font-size: 18px; }
.state .ic { font-size: 30px; }
.big.tv { background: #2b0d10; color: #ffb4b4; border: 1px solid #ff6b6b; margin-top: 10px; }
.big.open + .big, .big + .big { margin-top: 10px; }
.shotbox { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
.shotbtn { width: 100%; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.shotbox img { display: block; width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }
.msgbox { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 6px; }
.msgbox textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px; margin-top: 6px; resize: vertical; }
.send { width: 100%; font: inherit; font-size: 16px; font-weight: 700; color: #04202a; background: var(--teal); border: 0; border-radius: 14px; padding: 12px; margin-top: 8px; }
.mst { font-size: 13px; color: var(--soft); margin-top: 8px; line-height: 1.6; }
.mst b { color: #6ee7a8; } .mst b.wait { color: #e3b866; }
.name { cursor: pointer; }
.warn { font-size: 13px; color: #e3b866; margin-bottom: 8px; }
.empty { color: var(--soft); text-align: center; padding: 60px 10px; line-height: 1.9; }
.note { font-size: 12px; color: var(--faint); line-height: 1.7; margin-top: 10px; }
</style>
</head>
<body>
<h1>قفل البيت</h1>
<p class="sub">اقفل اليوتيوب أو التلفزيون كامل، وأرسل لهم رسالة، من أي مكان</p>
<div id="boxes"></div>
<p class="note">الأمر يوصل للبوكس خلال ثواني إذا كان شغّال ومتصل بالنت. لو اليوتيوب مفتوح وقت القفل يطلع منه على طول، وكل ما حاولوا يفتحونه يطلعون.<br>عشان تفتح الصفحة بضغطة: من سفاري اضغط مشاركة ← إضافة إلى الشاشة الرئيسية.</p>

<script>
'use strict';
var NTFY = 'https://ntfy.sh/';
function $(id) { return document.getElementById(id); }
function ar(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// مفتاح البيت يجي من الرابط (#المفتاح) وينحفظ في الجوال. كل البوكسات ترد على tvh-<المفتاح>-s
var key = (location.hash.match(/^#([a-z0-9]{8,})$/) || [])[1] || localStorage.getItem('bait-key');
if (key) localStorage.setItem('bait-key', key);
// نخلي المفتاح في الرابط عشان «إضافة إلى الشاشة الرئيسية» تحفظه
if (key && location.hash !== '#' + key) history.replaceState(null, '', location.pathname + '#' + key);

var boxes = {};   // رقم البوكس → { st, el }
var shots = {};   // رقم البوكس → آخر لقطة
var known = JSON.parse(localStorage.getItem('bait-boxes') || '[]');
if (!key) $('boxes').innerHTML = '<div class="empty">ما فيه بيت مربوط.<br>افتح رابط الربط اللي وصلك مرة وحدة، أو صوّر الباركود من الرئيسية في التلفزيون.</div>';
else {
  $('boxes').innerHTML = '<div class="empty" id="wait">يدوّر على البوكسات…</div>';
  var es = new EventSource(NTFY + 'tvh-' + key + '-s/sse?since=12h');
  es.onmessage = function (e) {
    var o, st;
    try { o = JSON.parse(e.data); st = JSON.parse(o.message); } catch (x) { return; }
    // لقطة شاشة: الصورة مرفقة بالرسالة (تنحذف من ntfy بعد ٣ ساعات)
    if (st.shotOf) {
      if (!o.attachment || Date.now() - st.ts > 3 * 3600000) return;
      shots[st.shotOf] = { url: o.attachment.url, ts: st.ts };
      if (boxes[st.shotOf]) { boxes[st.shotOf].shooting = false; boxes[st.shotOf].pending = ''; draw(boxes[st.shotOf]); }
      return;
    }
    if (!st.id) return;
    var b = boxes[st.id];
    if (!b) {
      b = boxes[st.id] = { id: st.id, topic: 'tvh-' + key + '-' + st.id, pending: '' };
      b.el = document.createElement('div');
      b.el.className = 'box';
      var w = $('wait'); if (w) w.remove();
      $('boxes').appendChild(b.el);
      if (known.indexOf(st.id) < 0) { known.push(st.id); localStorage.setItem('bait-boxes', JSON.stringify(known)); }
    }
    b.st = st;
    b.pending = '';
    draw(b);
  };
  // نطلب حالة جديدة من البوكسات اللي نعرفها
  setTimeout(function () { known.forEach(function (id) { if (!boxes[id] || Date.now() - boxes[id].st.ts > 15 * 60000) send({ topic: 'tvh-' + key + '-' + id }, { ping: 1 }); }); }, 2500);
}
setInterval(function () { Object.keys(boxes).forEach(function (t) { draw(boxes[t]); }); }, 30000);

function send(b, msg) {
  return fetch(NTFY + b.topic, { method: 'POST', body: JSON.stringify(msg) }).catch(function () {
    if (b.el) { b.pending = 'ما قدرت أرسل، تأكد من النت'; draw(b); }
  });
}

function setState(b, patch) {
  var cur = b.st || {};
  var want = { youtube: !!cur.youtube, apps: (cur.apps || []).slice(), all: !!cur.all, until: 0 };
  patch(want);
  b.pending = 'يرسل…';
  b.st = Object.assign({}, cur, want);   // نعرضها على طول، والبوكس يأكدها
  draw(b);
  send(b, want).then(function () { if (b.pending === 'يرسل…') { b.pending = 'وصل الأمر، بانتظار البوكس…'; draw(b); } });
}

function sendMsg(b) {
  var t = b.el.querySelector('textarea').value.trim();
  if (!t) return;
  b.el.querySelector('textarea').value = '';
  b.draft = '';
  b.sentMsg = t;
  b.pending = 'يرسل الرسالة…';
  draw(b);
  send(b, { msg: t });
}

function draw(b) {
  var s = b.st, el = b.el;
  if (!s) { el.innerHTML = '<div class="top"><h2>بوكس</h2><div class="st"><i></i>ينتظر البوكس…</div></div><p class="now">لو طال الانتظار، البوكس طافي أو بدون نت.</p>'; return; }
  // نحفظ اللي انكتب في خانة الرسالة قبل ما نعيد الرسم
  var ta = el.querySelector('textarea');
  if (ta) b.draft = ta.value;
  var focused = ta && document.activeElement === ta;
  var age = Date.now() - s.ts, online = age < 16 * 60000, yt = !!s.youtube, all = !!s.all, apps = s.apps || [];
  var html = '<div class="top"><h2 class="name">' + esc(s.name || 'بوكس') + '</h2><div class="st ' + (online ? 'ok' : 'bad') + '"><i></i>' +
    (online ? 'متصل' : 'ما رد من ' + ago(age)) + '</div></div>';
  html += '<div class="state"><span class="ic">' + (all ? '🔒' : yt ? '🚫' : '📺') + '</span><span>' +
    (all ? 'التلفزيون <b>مقفل كامل</b>' : 'اليوتيوب <b>' + (yt ? 'مقفل' : 'مفتوح') + '</b>' + (apps.length ? ' · ' + ar(apps.length) + ' تطبيق مقفل' : '')) + '</span></div>';
  if (!all && !yt && s.onYoutube && online) html += '<div class="warn">شغّالين على اليوتيوب الحين</div>';
  if (!all) html += '<button class="big ' + (yt ? 'open' : 'lock') + '" data-a="yt">' + (yt ? 'افتح اليوتيوب' : 'اقفل اليوتيوب') + '</button>';
  html += '<button class="big ' + (all ? 'open' : 'tv') + '" data-a="all">' + (all ? 'افتح التلفزيون' : '🔒 اقفل التلفزيون كامل') + '</button>';

  // لقطة الشاشة
  var shot = shots[b.id];
  html += '<div class="shotbox"><button class="shotbtn" data-a="shot">' + (b.shooting ? 'يصوّر…' : '📸 صوّر الشاشة') + '</button>' +
    (shot ? '<a href="' + esc(shot.url) + '" target="_blank"><img src="' + esc(shot.url) + '" alt=""></a><div class="mst">لقطة ' + (Date.now() - shot.ts < 60000 ? 'الحين' : 'قبل ' + ago(Date.now() - shot.ts)) + '</div>' : '') + '</div>';

  // الرسالة
  var msg = s.msg || {};
  var mstate = '';
  if (b.sentMsg && msg.text !== b.sentMsg) mstate = 'ترسل…';
  else if (msg.text) mstate = msg.seen ? 'قروها ✓' : 'طلعت على التلفزيون، ما قروها للحين';
  html += '<div class="msgbox"><div class="lbl">رسالة على كامل الشاشة</div><textarea rows="2" placeholder="اكتب رسالتك لهم…"></textarea>' +
    '<button class="send" data-a="msg">أرسل للتلفزيون</button>' +
    (msg.text ? '<div class="mst">آخر رسالة: «' + esc(msg.text.length > 40 ? msg.text.slice(0, 40) + '…' : msg.text) + '» — <b class="' + (msg.seen ? '' : 'wait') + '">' + mstate + '</b></div>' : '') + '</div>';

  // التطبيقات الثانية
  var list = s.list || [];
  if (list.length) {
    html += '<details' + (b.open ? ' open' : '') + '><summary>التطبيقات الثانية</summary>' + list.map(function (a) {
      var on = apps.indexOf(a.pkg) >= 0;
      return '<div class="row"><div class="l"><b>' + esc(a.label) + '</b><span>' + (on ? 'مقفل' : 'مفتوح') + '</span></div><button class="sw' + (on ? ' on' : '') + '" data-p="' + esc(a.pkg) + '"></button></div>';
    }).join('') + '</details>';
  }
  html += '<div class="pending">' + esc(b.pending) + '</div>';
  el.innerHTML = html;

  var nt = el.querySelector('textarea');
  nt.value = b.draft || '';
  if (focused) { nt.focus(); nt.setSelectionRange(nt.value.length, nt.value.length); }
  el.querySelector('[data-a=yt]') && (el.querySelector('[data-a=yt]').onclick = function () { setState(b, function (w) { w.youtube = !yt; }); });
  el.querySelector('[data-a=all]').onclick = function () {
    if (!all && !confirm('تقفل التلفزيون كامل؟ يطلع عليه قفل والريموت ما يشتغل لين تفتحه من هنا.')) return;
    setState(b, function (w) { w.all = !all; });
  };
  el.querySelector('[data-a=msg]').onclick = function () { sendMsg(b); };
  el.querySelector('[data-a=shot]').onclick = function () {
    b.shooting = true; draw(b);
    send(b, { shot: 1 });
    setTimeout(function () { if (b.shooting) { b.shooting = false; b.pending = 'ما وصلت اللقطة، جرّب مرة ثانية'; draw(b); } }, 25000);
  };
  el.querySelectorAll('[data-p]').forEach(function (btn) {
    btn.onclick = function () {
      var p = btn.dataset.p;
      setState(b, function (w) { var i = w.apps.indexOf(p); if (i >= 0) w.apps.splice(i, 1); else w.apps.push(p); });
    };
  });
  var det = el.querySelector('details');
  if (det) det.ontoggle = function () { b.open = det.open; };
  // الضغط على اسم البوكس يفتح التطبيقات الثانية
  el.querySelector('.name').onclick = function () { b.open = !b.open; draw(b); };
}

function ago(ms) {
  var m = Math.round(ms / 60000);
  if (m < 60) return ar(m) + ' د';
  var h = Math.round(m / 60);
  return h < 48 ? ar(h) + ' ساعة' : ar(Math.round(h / 24)) + ' يوم';
}
</script>
</body>
</html>
